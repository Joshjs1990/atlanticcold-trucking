  <style>
    .state-link{cursor:pointer;outline:none}
    .state{fill-rule:evenodd;stroke-linejoin:round;stroke-width:2.2;transition:fill .2s ease,stroke .2s ease,filter .2s ease}
    .state-muted{fill:#edf6fb;stroke:#a9cadc}
    .state-active{fill:#1686ff;stroke:#07111d;stroke-width:3;filter:url(#active-shadow)}
    .state-labels,.active-routes,.coverage-badge,.compass{pointer-events:none}
    .state-label{fill:#173248;font-family:Arial,sans-serif;font-size:30px;font-style:italic;font-weight:800;letter-spacing:1px;text-anchor:middle;transition:fill .2s ease}
    .state-label.label-active{fill:#fff}
    .route,.coverage-name{display:none}
    .route-current,.coverage-current{display:block}
    .route-line{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:7 8;stroke-linecap:round;stroke-linejoin:round}
    .point-halo{fill:none;stroke:#fff;stroke-width:2;opacity:.55}
    .point-core{fill:#fff;stroke:#07111d;stroke-width:2}
    .city-label{fill:#fff;paint-order:stroke;stroke:#07111d;stroke-width:3px;stroke-linejoin:round;font-family:Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:.2px}
    .map-shell:has(.state-link:hover) .state,.map-shell:has(.state-link:focus) .state{fill:#edf6fb;stroke:#a9cadc;stroke-width:2.2;filter:none}
    .map-shell:has(.state-link:hover) .state-label,.map-shell:has(.state-link:focus) .state-label{fill:#173248}
    .map-shell:has(.state-link:hover) .route,.map-shell:has(.state-link:focus) .route,.map-shell:has(.state-link:hover) .coverage-name,.map-shell:has(.state-link:focus) .coverage-name{display:none}
    .map-shell:has(#link-NY:hover) #state-NY,.map-shell:has(#link-NY:focus) #state-NY{fill:#1686ff;stroke:#07111d;stroke-width:3;filter:url(#active-shadow)}
    .map-shell:has(#link-NY:hover) #label-NY,.map-shell:has(#link-NY:focus) #label-NY{fill:#fff}
    .map-shell:has(#link-NY:hover) .route-NY,.map-shell:has(#link-NY:focus) .route-NY{display:block}
    .map-shell:has(#link-NY:hover) .coverage-name-NY,.map-shell:has(#link-NY:focus) .coverage-name-NY{display:block}
    .map-shell:has(#link-NJ:hover) #state-NJ,.map-shell:has(#link-NJ:focus) #state-NJ{fill:#1686ff;stroke:#07111d;stroke-width:3;filter:url(#active-shadow)}
    .map-shell:has(#link-NJ:hover) #label-NJ,.map-shell:has(#link-NJ:focus) #label-NJ{fill:#fff}
    .map-shell:has(#link-NJ:hover) .route-NJ,.map-shell:has(#link-NJ:focus) .route-NJ{display:block}
    .map-shell:has(#link-NJ:hover) .coverage-name-NJ,.map-shell:has(#link-NJ:focus) .coverage-name-NJ{display:block}
    .map-shell:has(#link-PA:hover) #state-PA,.map-shell:has(#link-PA:focus) #state-PA{fill:#1686ff;stroke:#07111d;stroke-width:3;filter:url(#active-shadow)}
    .map-shell:has(#link-PA:hover) #label-PA,.map-shell:has(#link-PA:focus) #label-PA{fill:#fff}
    .map-shell:has(#link-PA:hover) .route-PA,.map-shell:has(#link-PA:focus) .route-PA{display:block}
    .map-shell:has(#link-PA:hover) .coverage-name-PA,.map-shell:has(#link-PA:focus) .coverage-name-PA{display:block}
    .map-shell:has(#link-CT:hover) #state-CT,.map-shell:has(#link-CT:focus) #state-CT{fill:#1686ff;stroke:#07111d;stroke-width:3;filter:url(#active-shadow)}
